title: Zendure AppDaemon Proxy
views:
- title: Overview
  path: '0'
  cards:
  - type: markdown
    content: '## Zendure batteries

      Check device health before interpreting power and SoC.'
  - type: entities
    entities:
    - sensor.proxy_zendure_pool_healthy
    - sensor.vermogensopdracht
    - sensor.zendure_actief_device
    - sensor.zendure_proxy_versie
  - type: grid
    columns: 1
    square: false
    cards:
    - type: entities
      title: Device 1
      entities:
      - sensor.zendure_1_health
      - sensor.zendure_1_laadpercentage
      - sensor.zendure_1_vermogen_aansturing
      - sensor.zendure_1_deep_standby
      - sensor.zendure_1_wifi_rssi
    - type: entities
      title: Device 2
      entities:
      - sensor.zendure_2_health
      - sensor.zendure_2_laadpercentage
      - sensor.zendure_2_vermogen_aansturing
      - sensor.zendure_2_deep_standby
      - sensor.zendure_2_wifi_rssi
    - type: entities
      title: Device 3
      entities:
      - sensor.zendure_3_health
      - sensor.zendure_3_laadpercentage
      - sensor.zendure_3_vermogen_aansturing
      - sensor.zendure_3_deep_standby
      - sensor.zendure_3_wifi_rssi
- title: History
  path: history
  cards:
  - type: history-graph
    hours_to_show: 24
    entities:
    - sensor.zendure_1_laadpercentage
    - sensor.zendure_2_laadpercentage
    - sensor.zendure_3_laadpercentage
  - type: history-graph
    hours_to_show: 6
    entities:
    - sensor.zendure_1_vermogen_aansturing
    - sensor.zendure_2_vermogen_aansturing
    - sensor.zendure_3_vermogen_aansturing
- title: Diagnostics
  path: metrics
  cards:
  - type: entities
    title: Requests and queue
    entities:
    - sensor.zendure_proxy_incoming_get_total
    - sensor.zendure_proxy_incoming_post_total
    - sensor.zendure_proxy_queue_get_depth
    - sensor.zendure_proxy_queue_post_depth
  - type: entities
    title: Modes
    entities:
    - sensor.dual_mode_demper_status
    - sensor.synchroon_laden_status
    - sensor.beide_actief_status
    - sensor.anti_pingpong_status
    - sensor.relay_saver_status
