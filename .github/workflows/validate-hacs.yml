name: Validate HACS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt -r requirements-test.txt
      - run: python -m compileall -q apps/Zendure-AppDaemon-Proxy tools
      - run: PYTHONPATH=apps/Zendure-AppDaemon-Proxy python -c 'import zendure_proxy; print(zendure_proxy.ZendureProxy)'
      - run: python -m unittest discover -s tests
      - run: python -m pytest -q
      - run: python scripts/check_provenance.py
      - run: python scripts/build_release.py
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: appdaemon
